name: Kokonut_Pets
version: '${version}'
description: 에고버스 펫 플러그인
load: POSTWORLD
authors: [pingpong, Nocsy]
website: https://wiki.egoverse.kr

main: fr.nocsy.mcpets.MCPets
api-version: '26.3'
database: false
provides: [MCPets]
depend:
  - Kokonut-Core
  - MythicMobs
  - Kokonut_Model
softdepend:
  - Nexo
  - Kokonut_Guard
  - WorldEdit
  - LuckPerms
  - PlaceholderAPI
loadbefore: []

# Plugin messaging channel "mcpets:sync" is registered in code via Bukkit.getMessenger()
# (the 'channels' key is not part of the Bukkit plugin descriptor schema)

commands:
  mcpets:
    description: 펫 메뉴를 열어요. 관리자는 /펫 <리로드|소환|회수|열기|가방|아이템|먹이|신호봉|카테고리|통계초기화|편집기|디버그>
    usage: /펫 [메뉴|이름]
    permission: mcpets.use
    aliases: [펫]
  mcmounts:
    description: 탈것 메뉴를 열어요.
    usage: /탈것 [메뉴]
    permission: mcpets.use
    aliases: [탈것]

permissions:
  mcpets.use:
    description: /펫, /탈것 사용
    default: true
  mcpets.admin:
    description: 펫 관리자 명령어
    default: op
  mcpets.color:
    description: 펫 이름에 색 코드 사용
    default: op
